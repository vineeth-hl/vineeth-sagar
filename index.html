<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/V_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vineeth Sagar H L | Portfolio</title>
  <meta name="description"
    content="Vineeth Sagar H L — AI/ML undergraduate. Projects across cybersecurity AI, agentic systems and RAG pipelines." />
  <!-- per-route title/description for pre-rendered pages are set in main.jsx onPageRendered() -->
  <!-- Set the theme before paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
